name: Dependent Quality Gates

on:
  workflow_dispatch:
  push:
    branches:
      - feature/test-coverage-gate

jobs:

  gate1-code-quality:
    name: Gate 1 - Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: black --check .
      - run: ruff check .

  gate2-test-coverage:
    name: Gate 2 - Test Coverage
    needs: gate1-code-quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: pytest -v

      - run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=90

  gate3-security:
    name: Gate 3 - Security
    needs: gate2-test-coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          echo "Dependabot Enabled"
          echo "Security Gate Passed"

  notify-failure:
    name: Email Notification
    runs-on: ubuntu-latest

    needs:
      - gate1-code-quality
      - gate2-test-coverage
      - gate3-security

    if: always()

    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Quality Gate Execution Summary"
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions

          body: |
            Quality Gate Execution Summary

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

            Gate 1 - Code Quality:
            ${{ needs.gate1-code-quality.result }}

            Gate 2 - Test Coverage:
            ${{ needs.gate2-test-coverage.result }}

            Gate 3 - Security:
            ${{ needs.gate3-security.result }}

            Workflow Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}